<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Exchange - Login</title>
  <link rel="stylesheet" href="Client%20Side%20Web%20pages/client.css">
</head>
<body class="login-page">
  <main class="login-wrapper">
    <section class="login-card">
      <div class="login-logo">👤</div>
      <h1>Campus Exchange</h1>
      <p class="login-subtitle">Login to continue</p>
      <form id="loginForm">
        <label for="email">Email / User ID</label>
        <input id="email" type="text" placeholder="Enter your email" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <p id="loginMessage" class="login-message"></p>
        <button class="dark-button full-button" type="submit">Login</button>
      </form>
      <p class="demo-help"><b>Client:</b> client@campus.com / client123</p>
      <p class="demo-help"><b>Admin:</b> admin@campus.com / admin123</p>
      <p>New student? <a href="Client%20Side%20Web%20pages/client.html#signup">Create an account</a></p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
